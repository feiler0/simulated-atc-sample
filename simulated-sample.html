<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟通话样本｜ICAO OPI 学习</title>
<style>
  :root {
    --bg: #0d1b2a;
    --panel: #172b3e;
    --panel2: #203a52;
    --text: #e5eef5;
    --muted: #9db4c6;
    --accent: #4db6e6;
    --pilot: #e6a23c;
    --atc: #5bc0de;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  h1 {
    font-size: 26px;
    margin: 8px 0 4px;
  }
  .sub {
    color: var(--muted);
    margin-bottom: 20px;
    font-size: 14px;
  }
  .card {
    background: var(--panel);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 6px 24px rgba(0,0,0,.25);
  }
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  button {
    border: 0;
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
    transition: filter .15s, transform .1s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.97); }
  button.secondary {
    background: var(--panel2);
    border: 1px solid #31536b;
  }
  button.ghost {
    background: transparent;
    border: 1px solid #31536b;
    color: var(--muted);
  }
  audio { width: 100%; margin-top: 12px; }
  .progress-note { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .turn {
    border: 1px solid #2b4a61;
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
    background: var(--panel2);
  }
  .turn-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    cursor: pointer;
    user-select: none;
  }
  .turn-head:hover { background: #26445c; }
  .badge {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .badge.pilot { background: var(--pilot); color: #1f1500; }
  .badge.atc { background: var(--atc); color: #00242d; }
  .turn-label { font-size: 14px; color: var(--muted); }
  .reveal-hint { margin-left: auto; font-size: 12px; color: var(--muted); }
  .turn-body {
    display: none;
    padding: 12px 14px 16px;
    border-top: 1px solid #2b4a61;
  }
  .turn.open .turn-body { display: block; }
  .en {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .zh {
    font-size: 15px;
    color: #cfe0ec;
  }
  .note {
    font-size: 13px;
    color: var(--muted);
    margin-top: 16px;
  }
</style>
</head>

    { role: "pilot", label: "机组", en: "Wuhan Control, China Eastern five two one, we have an engine failure, request return to Wuhan.", zh: "武汉区调，东航 521，我们发动机失效，请求返回武汉。" },
    { role: "atc", label: "管制员", en: "China Eastern five two one, roger. Say your position.", zh: "东航 521，收到。报告位置。" },
    { role: "pilot", label: "机组", en: "We're one hundred miles east of Wuhan, level nine thousand two hundred meters.", zh: "我们在武汉以东 100 海里，高度 9200 米。" },
    { role: "atc", label: "管制员", en: "China Eastern five two one, turn left heading two eight zero, descend and maintain six thousand meters, expect runway two two.", zh: "东航 521，左转航向 280，下降并保持 6000 米，预计 22 号跑道。" },
    { role: "pilot", label: "机组", en: "Left heading two eight zero, down to six thousand meters, China Eastern five two one.", zh: "左转 280，下降到 6000 米，东航 521。" },
    { role: "atc", label: "管制员", en: "China Eastern five two one, say souls on board and fuel remaining.", zh: "东航 521，报告机上人数和剩余油量。" },
    { role: "pilot", label: "机组", en: "One hundred fifty souls on board, fuel remaining one hour.", zh: "机上 150 人，剩余燃油 1 小时。" },
    { role: "atc", label: "管制员", en: "China Eastern five two one, are you declaring an emergency?", zh: "东航 521，你在宣布紧急情况吗？" },
    { role: "pilot", label: "机组", en: "Affirm, we are declaring an emergency.", zh: "确认，我们宣布紧急情况。" },
    { role: "atc", label: "管制员", en: "Roger. China Eastern five two one, you are number one for Wuhan. All other traffic, expect holding.", zh: "收到。东航 521，你是武汉第一优先。其他所有飞机，预计等待。" },
    { role: "pilot", label: "机组", en: "Descending through seven thousand meters, we may need to hold due to weight.", zh: "正在通过 7000 米，我们可能需要因重量等待。" },
    { role: "atc", label: "管制员", en: "China Eastern five two one, do you require fire and rescue on arrival?", zh: "东航 521，到达时你需要消防和救援吗？" },
    { role: "pilot", label: "机组", en: "Affirm, request fire and rescue, we will land runway two two.", zh: "确认，请求消防和救援，我们将在 22 号跑道落地。" },
    { role: "atc", label: "管制员", en: "China Eastern five two one, fire and rescue alerted. You are cleared to land runway two two.", zh: "东航 521，消防和救援已通知。许可 22 号跑道落地。" },
    { role: "pilot", label: "机组", en: "Cleared to land runway two two, China Eastern five two one.", zh: "许可落地 22 号跑道，东航 521。" },
  ];

  const player = document.getElementById("player");
  const playBtn = document.getElementById("playBtn");
  const pauseBtn = document.getElementById("pauseBtn");
  const restartBtn = document.getElementById("restartBtn");
  const toggleAllBtn = document.getElementById("toggleAllBtn");
  const progressNote = document.getElementById("progressNote");
  const transcript = document.getElementById("transcript");

  function fmt(sec) {
    if (!Number.isFinite(sec)) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, "0");
    return `${m}:${s}`;
  }

  function updateProgress() {
    progressNote.textContent = `${fmt(player.currentTime)} / ${fmt(player.duration)}`;
  }

  function render() {
    transcript.innerHTML = "";
    LINES.forEach((line, index) => {
      const div = document.createElement("div");
      div.className = "turn";
      div.innerHTML = `
        <div class="turn-head">
          <span class="badge ${line.role}">${line.label}</span>
          <span class="turn-label">第 ${index + 1} 句</span>
          <span class="reveal-hint">点击显示/隐藏文本</span>
        </div>
        <div class="turn-body">
          <div class="en">${line.en}</div>
          <div class="zh">${line.zh}</div>
        </div>`;
      div.querySelector(".turn-head").addEventListener("click", () => {
        div.classList.toggle("open");
      });
      transcript.appendChild(div);
    });
  }

  playBtn.addEventListener("click", () => {
    player.play();
  });
  pauseBtn.addEventListener("click", () => {
    player.pause();
  });
  restartBtn.addEventListener("click", () => {
    player.currentTime = 0;
    player.play();
  });
  player.addEventListener("timeupdate", updateProgress);
  player.addEventListener("loadedmetadata", updateProgress);
  player.addEventListener("ended", () => {
    playBtn.textContent = "▶ 重新播放";
  });
  player.addEventListener("play", () => {
    playBtn.textContent = "正在播放…";
  });
  player.addEventListener("pause", () => {
    playBtn.textContent = "▶ 开始播放";
  });

  toggleAllBtn.addEventListener("click", () => {
    const allOpen = transcript.querySelectorAll(".turn.open").length === LINES.length;
    transcript.querySelectorAll(".turn").forEach(el => {
      el.classList.toggle("open", !allOpen);
    });
    toggleAllBtn.textContent = allOpen ? "显示全部文本" : "隐藏全部文本";
  });

  render();
  updateProgress();
</script>
</body>
</html>
